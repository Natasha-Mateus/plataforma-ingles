<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meu Perfil - MD English</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
      <h1>Meu Perfil</h1>
      <div class="card" style="max-width:420px;">
        <label>Nome</label>
        <p id="pNome" style="margin:0 0 14px; font-weight:500;"></p>
        <label>Email</label>
        <p id="pEmail" style="margin:0;"></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { renderSidebar } from "./sidebar.js";
    import { contarNaoLidas } from "./helpers.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      const userSnap = await getDoc(doc(db, "usuarios", user.uid));
      if (!userSnap.exists()) { window.location.href = "index.html"; return; }
      const usuario = userSnap.data();
      if (usuario.papel === "admin") { window.location.href = "admin-dashboard.html"; return; }

      renderSidebar({ activeKey: "perfil", role: "aluno", nomeUsuario: usuario.nome, naoLidas: await contarNaoLidas(db, user.uid) });
      document.getElementById("btnSairSidebar").addEventListener("click", () => signOut(auth).then(() => window.location.href = "index.html"));

      document.getElementById("pNome").textContent = usuario.nome || "—";
      document.getElementById("pEmail").textContent = user.email;
    });
  </script>
</body>
</html>
