<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard - MD English</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
      <h1 id="saudacao">Olá!</h1>
      <p class="muted">Aqui está o seu progresso geral.</p>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="value" id="statProgresso">0%</div>
          <div class="label">Progresso geral</div>
        </div>
        <div class="stat-card">
          <div class="value" id="statModulos">0</div>
          <div class="label">Módulos liberados</div>
        </div>
        <div class="stat-card">
          <div class="value" id="statConcluidos">0</div>
          <div class="label">Conteúdos concluídos</div>
        </div>
        <div class="stat-card">
          <div class="value" id="statPendentes">0</div>
          <div class="label">Atividades pendentes</div>
        </div>
        <div class="stat-card">
          <div class="value" id="statAguardando">0</div>
          <div class="label">Correções aguardando avaliação</div>
        </div>
      </div>

      <div class="card">
        <h2>Continuar de onde parou</h2>
        <p class="muted" id="moduloAtualTexto" style="margin-bottom:12px;">Carregando...</p>
        <button class="primary" id="btnContinuar" style="display:none;">Continuar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { renderSidebar } from "./sidebar.js";
    import { contarNaoLidas } from "./helpers.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }

      const userSnap = await getDoc(doc(db, "usuarios", user.uid));
      if (!userSnap.exists()) { window.location.href = "index.html"; return; }
      const usuario = { uid: user.uid, ...userSnap.data() };

      if (usuario.papel === "admin") { window.location.href = "admin-dashboard.html"; return; }

      renderSidebar({ activeKey: "dashboard", role: "aluno", nomeUsuario: usuario.nome, naoLidas: await contarNaoLidas(db, user.uid) });
      document.getElementById("btnSairSidebar").addEventListener("click", () => signOut(auth).then(() => window.location.href = "index.html"));

      document.getElementById("saudacao").textContent = `Olá, ${usuario.nome || ""}!`;

      const liberados = usuario.conteudosLiberados || [];
      const concluidos = usuario.conteudosConcluidos || [];

      const pendentes = liberados.filter(id => !concluidos.includes(id)).length;
      document.getElementById("statPendentes").textContent = pendentes;

      const respostasSnap = await getDocs(query(collection(db, "respostasAbertas"), where("userId", "==", user.uid), where("status", "==", "aguardando")));
      document.getElementById("statAguardando").textContent = respostasSnap.size;

      const totalConteudosSnap = await getDocs(collection(db, "conteudos"));
      const totalConteudos = totalConteudosSnap.size;

      const percentual = totalConteudos > 0 ? Math.round((concluidos.length / totalConteudos) * 100) : 0;
      document.getElementById("statProgresso").textContent = percentual + "%";
      document.getElementById("statConcluidos").textContent = concluidos.length;

      // Conta em quantos módulos distintos o aluno tem pelo menos um conteúdo liberado
      const modulosSnap = await getDocs(collection(db, "modulos"));
      let modulosComAcesso = 0;
      let primeiroModuloComAcesso = null;

      for (const mDoc of modulosSnap.docs) {
        const conteudosDoModulo = totalConteudosSnap.docs.filter(c => c.data().moduloId === mDoc.id);
        const temAcesso = conteudosDoModulo.some(c => liberados.includes(c.id));
        if (temAcesso) {
          modulosComAcesso++;
          if (!primeiroModuloComAcesso) primeiroModuloComAcesso = mDoc.id;
        }
      }
      document.getElementById("statModulos").textContent = modulosComAcesso;

      const textoEl = document.getElementById("moduloAtualTexto");
      const btnEl = document.getElementById("btnContinuar");
      if (primeiroModuloComAcesso) {
        textoEl.textContent = "Você tem conteúdo liberado esperando por você.";
        btnEl.style.display = "inline-block";
        btnEl.addEventListener("click", () => window.location.href = `modulo.html?id=${primeiroModuloComAcesso}`);
      } else {
        textoEl.textContent = "Nenhum conteúdo liberado ainda. Assim que o professor liberar, ele aparece aqui.";
      }
    });
  </script>
</body>
</html>
