<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Configurações - MD English Admin</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
      <h1>Configurações</h1>
      <p class="muted">Ajustes de comportamento da plataforma.</p>

      <div class="card">
        <h2>Liberação sequencial por módulo</h2>
        <p class="small" style="margin-top:-6px; margin-bottom:14px;">
          Quando ativada, ao concluir um conteúdo o próximo da sequência é liberado automaticamente pro aluno,
          sem precisar marcar manualmente na matriz de liberação.
        </p>
        <div id="listaModulos"><p class="small">Carregando...</p></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { renderSidebar } from "./sidebar.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      const userSnap = await getDoc(doc(db, "usuarios", user.uid));
      if (!userSnap.exists() || userSnap.data().papel !== "admin") {
        window.location.href = "index.html"; return;
      }

      renderSidebar({ activeKey: "configuracoes", role: "admin", nomeUsuario: userSnap.data().nome });
      document.getElementById("btnSairSidebar").addEventListener("click", () => signOut(auth).then(() => window.location.href = "index.html"));

      const modulosSnap = await getDocs(collection(db, "modulos"));
      const modulos = modulosSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

      const container = document.getElementById("listaModulos");
      if (modulos.length === 0) {
        container.innerHTML = `<p class="small">Nenhum módulo criado ainda.</p>`;
        return;
      }

      container.innerHTML = modulos.map(m => `
        <label class="checkbox-row" style="border-bottom:1px solid var(--border); padding:10px 0;">
          <input type="checkbox" data-id="${m.id}" ${m.liberacaoSequencial === true ? "checked" : ""} />
          ${m.nome}
        </label>
      `).join("");

      container.querySelectorAll("input[type=checkbox]").forEach(cb => {
        cb.addEventListener("change", async (e) => {
          await updateDoc(doc(db, "modulos", e.target.dataset.id), { liberacaoSequencial: e.target.checked });
        });
      });
    });
  </script>
</body>
</html>
