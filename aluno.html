<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minhas Aulas</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <h1 style="margin:0;">Minhas Aulas</h1>
      <div>
        <span class="who" id="nomeAluno"></span>
        <button class="link" id="btnSair" style="margin-left:14px;">Sair</button>
      </div>
    </div>

    <div style="display:grid; grid-template-columns: 240px 1fr; gap: 20px;">
      <div>
        <h2 style="font-size:14px; color:var(--ink-light); text-transform:uppercase; letter-spacing:0.03em;">Conteúdo</h2>
        <div class="content-list" id="listaConteudos">
          <p class="small">Carregando...</p>
        </div>
      </div>

      <div id="areaConteudo">
        <p class="muted">Selecione uma aula ao lado.</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, collection, getDocs, query, where, addDoc
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usuarioAtual = null;
    let liberados = [];
    let todosConteudos = [];

    document.getElementById("btnSair").addEventListener("click", () => signOut(auth).then(() => window.location.href = "index.html"));

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      const userSnap = await getDoc(doc(db, "usuarios", user.uid));
      if (!userSnap.exists()) {
        window.location.href = "index.html";
        return;
      }

      usuarioAtual = { uid: user.uid, ...userSnap.data() };
      liberados = usuarioAtual.conteudosLiberados || [];
      document.getElementById("nomeAluno").textContent = usuarioAtual.nome || user.email;

      await carregarConteudos();
    });

    async function carregarConteudos() {
      const snap = await getDocs(collection(db, "conteudos"));
      todosConteudos = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

      const lista = document.getElementById("listaConteudos");
      lista.innerHTML = "";

      todosConteudos.forEach(c => {
        const liberado = liberados.includes(c.id);
        const item = document.createElement("div");
        item.className = "content-item" + (liberado ? "" : " locked");
        item.textContent = (liberado ? "▶ " : "🔒 ") + c.titulo;
        if (liberado) {
          item.addEventListener("click", () => abrirConteudo(c, item));
        }
        lista.appendChild(item);
      });
    }

    async function abrirConteudo(conteudo, itemEl) {
      document.querySelectorAll(".content-item").forEach(el => el.classList.remove("active"));
      itemEl.classList.add("active");

      const area = document.getElementById("areaConteudo");
      area.innerHTML = `
        <h2>${conteudo.titulo}</h2>
        <div class="video-frame">
          <iframe src="https://www.youtube.com/embed/${conteudo.youtubeId}?rel=0&modestbranding=1"
            allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div id="areaExercicio"></div>
      `;

      const exSnap = await getDocs(query(collection(db, "exercicios"), where("conteudoId", "==", conteudo.id)));
      const areaEx = document.getElementById("areaExercicio");

      if (exSnap.empty) {
        areaEx.innerHTML = `<p class="small">Sem exercício cadastrado para esta aula ainda.</p>`;
        return;
      }

      exSnap.forEach(exDoc => {
        const ex = exDoc.data();
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<p style="font-weight:500; margin:0 0 12px;">${ex.pergunta}</p>`;

        ex.alternativas.forEach(alt => {
          const opt = document.createElement("div");
          opt.className = "option";
          opt.textContent = alt;
          opt.addEventListener("click", async () => {
            const acertou = alt === ex.respostaCerta;
            card.querySelectorAll(".option").forEach(o => {
              o.style.pointerEvents = "none";
              if (o.textContent === ex.respostaCerta) o.classList.add("correct");
              else if (o === opt) o.classList.add("wrong");
            });
            const feedback = document.createElement("p");
            feedback.className = "feedback " + (acertou ? "ok" : "no");
            feedback.textContent = acertou ? "Certo! 🎉" : `Errado. A resposta certa era "${ex.respostaCerta}".`;
            card.appendChild(feedback);

            await addDoc(collection(db, "respostasAluno"), {
              userId: usuarioAtual.uid,
              exercicioId: exDoc.id,
              respostaDada: alt,
              acertou,
              data: new Date().toISOString()
            });
          });
          card.appendChild(opt);
        });

        areaEx.appendChild(card);
      });
    }
  </script>
</body>
</html>
