<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar - MD English</title>
<link rel="stylesheet" href="style.css" />
</head>
<body style="background: var(--navy);">
  <div class="wrap-narrow">
    <div class="card" style="padding: 32px;">
      <h1 style="color: var(--navy);">MD English</h1>
      <p class="muted">Entre com seu email e senha.</p>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="voce@exemplo.com" />

      <label for="senha">Senha</label>
      <input type="password" id="senha" />

      <p class="error-msg" id="erro" style="display:none;"></p>

      <button class="primary" id="btnEntrar" style="width:100%;">Entrar</button>
    </div>
    <p class="small" style="color: rgba(255,255,255,0.7); text-align:center;">
      Esqueceu a senha? Peça pro professor redefinir no painel admin.
    </p>
  </div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const erroEl = document.getElementById("erro");
    function mostrarErro(msg) {
      erroEl.textContent = msg;
      erroEl.style.display = "block";
    }

    document.getElementById("btnEntrar").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      if (!email || !senha) {
        mostrarErro("Preencha email e senha.");
        return;
      }

      try {
        const cred = await signInWithEmailAndPassword(auth, email, senha);
        const userDoc = await getDoc(doc(db, "usuarios", cred.user.uid));

        if (!userDoc.exists()) {
          mostrarErro("Usuário autenticado, mas sem cadastro em 'usuarios'. Peça pro admin te cadastrar.");
          return;
        }

        const papel = userDoc.data().papel;
        window.location.href = papel === "admin" ? "admin-dashboard.html" : "dashboard.html";
      } catch (e) {
        mostrarErro("Email ou senha incorretos.");
        console.error(e);
      }
    });
  </script>
</body>
</html>
