<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Correções - MD English Admin</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
      <h1>Correções</h1>
      <p class="muted">Redações e respostas abertas enviadas pelos alunos.</p>

      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <button id="tipoTodas" class="secondary">Todas (<span id="contTodas">0</span>)</button>
        <button id="tipoRedacao">Redação (<span id="contRedacao">0</span>)</button>
        <button id="tipoRespostaAberta">Resposta aberta (<span id="contRespostaAberta">0</span>)</button>
      </div>

      <div style="display:flex; gap:8px; margin-bottom:16px;">
        <button id="filtroAguardando" class="secondary">Aguardando (<span id="contAguardando">0</span>)</button>
        <button id="filtroCorrigidas">Corrigidas (<span id="contCorrigidas">0</span>)</button>
      </div>

      <div id="lista"><p class="small">Carregando...</p></div>
    </div>
  </div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { renderSidebar } from "./sidebar.js";
    import { criarNotificacao, liberarProximoSeSequencial, contarAguardandoCorrecao } from "./helpers.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, collection, getDocs, updateDoc, arrayUnion, query, where
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let todasRespostas = [];
    let conteudosPorId = {};
    let filtroAtual = "aguardando";
    let filtroTipo = "todas";

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      const userSnap = await getDoc(doc(db, "usuarios", user.uid));
      if (!userSnap.exists() || userSnap.data().papel !== "admin") {
        window.location.href = "index.html"; return;
      }

      renderSidebar({ activeKey: "correcoes", role: "admin", nomeUsuario: userSnap.data().nome, badges: { correcoes: await contarAguardandoCorrecao(db) } });
      document.getElementById("btnSairSidebar").addEventListener("click", () => signOut(auth).then(() => window.location.href = "index.html"));

      document.getElementById("filtroAguardando").addEventListener("click", () => { filtroAtual = "aguardando"; atualizarBotoesFiltro(); renderLista(); });
      document.getElementById("filtroCorrigidas").addEventListener("click", () => { filtroAtual = "corrigida"; atualizarBotoesFiltro(); renderLista(); });
      document.getElementById("tipoTodas").addEventListener("click", () => { filtroTipo = "todas"; atualizarBotoesFiltro(); renderLista(); });
      document.getElementById("tipoRedacao").addEventListener("click", () => { filtroTipo = "redacao"; atualizarBotoesFiltro(); renderLista(); });
      document.getElementById("tipoRespostaAberta").addEventListener("click", () => { filtroTipo = "resposta_aberta"; atualizarBotoesFiltro(); renderLista(); });

      await carregarTudo();
    });

    function atualizarBotoesFiltro() {
      document.getElementById("filtroAguardando").className = filtroAtual === "aguardando" ? "secondary" : "";
      document.getElementById("filtroCorrigidas").className = filtroAtual === "corrigida" ? "secondary" : "";
      document.getElementById("tipoTodas").className = filtroTipo === "todas" ? "secondary" : "";
      document.getElementById("tipoRedacao").className = filtroTipo === "redacao" ? "secondary" : "";
      document.getElementById("tipoRespostaAberta").className = filtroTipo === "resposta_aberta" ? "secondary" : "";
    }

    async function carregarTudo() {
      const [respostasSnap, conteudosSnap, modulosSnap] = await Promise.all([
        getDocs(collection(db, "respostasAbertas")),
        getDocs(collection(db, "conteudos")),
        getDocs(collection(db, "modulos"))
      ]);

      conteudosPorId = {};
      conteudosSnap.docs.forEach(d => conteudosPorId[d.id] = d.data());

      const modulosPorId = {};
      modulosSnap.docs.forEach(d => modulosPorId[d.id] = d.data());

      todasRespostas = respostasSnap.docs.map(d => {
        const dados = d.data();
        const conteudo = conteudosPorId[dados.conteudoId] || {};
        return { id: d.id, ...dados, _nomeModulo: modulosPorId[dados.moduloId]?.nome || "—", _tipo: conteudo.tipo || "resposta_aberta" };
      });

      document.getElementById("contTodas").textContent = todasRespostas.length;
      document.getElementById("contRedacao").textContent = todasRespostas.filter(r => r._tipo === "redacao").length;
      document.getElementById("contRespostaAberta").textContent = todasRespostas.filter(r => r._tipo === "resposta_aberta").length;
      document.getElementById("contAguardando").textContent = todasRespostas.filter(r => r.status === "aguardando").length;
      document.getElementById("contCorrigidas").textContent = todasRespostas.filter(r => r.status === "corrigida").length;

      renderLista();
    }

    function renderLista() {
      const container = document.getElementById("lista");
      const itens = todasRespostas
        .filter(r => r.status === filtroAtual)
        .filter(r => filtroTipo === "todas" || r._tipo === filtroTipo)
        .sort((a, b) => new Date(b.dataEnvio) - new Date(a.dataEnvio));

      if (itens.length === 0) {
        container.innerHTML = `<p class="small">Nada por aqui.</p>`;
        return;
      }

      container.innerHTML = itens.map(r => {
        const conteudo = conteudosPorId[r.conteudoId] || {};
        return `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <p style="font-weight:500; margin:0 0 2px;">${r.nomeAluno || "Aluno"} · ${conteudo.titulo || "Atividade"}</p>
                <p class="small" style="margin:0;">Módulo: ${r._nomeModulo} · Enviado em ${new Date(r.dataEnvio).toLocaleDateString("pt-BR")}</p>
              </div>
              ${r.status === "aguardando" ? `<span class="badge andamento">Aguardando</span>` : `<span class="badge concluido">Corrigida</span>`}
            </div>
            <p style="white-space:pre-wrap; margin:12px 0;">${r.resposta}</p>
            ${r.status === "aguardando" ? `
              <label>Nota (opcional)</label>
              <input type="text" id="nota-${r.id}" placeholder="Ex: 8, ou B+, o que fizer sentido" />
              <label>Feedback</label>
              <textarea id="feedback-${r.id}" rows="3" placeholder="Comentário pro aluno"></textarea>
              <button class="primary" data-id="${r.id}" data-conteudo="${r.conteudoId}" data-uid="${r.userId}" class="btnCorrigir">Enviar correção</button>
            ` : `
              ${r.nota !== undefined && r.nota !== "" ? `<p class="small" style="margin:0 0 4px;"><strong>Nota:</strong> ${r.nota}</p>` : ""}
              ${r.feedback ? `<p class="small" style="margin:0;"><strong>Feedback enviado:</strong> ${r.feedback}</p>` : ""}
            `}
          </div>
        `;
      }).join("");

      container.querySelectorAll(".btnCorrigir, button[data-id]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.id;
          const conteudoId = btn.dataset.conteudo;
          const uid = btn.dataset.uid;
          const nota = document.getElementById(`nota-${id}`).value.trim();
          const feedback = document.getElementById(`feedback-${id}`).value.trim();

          await updateDoc(doc(db, "respostasAbertas", id), {
            status: "corrigida", nota, feedback, dataCorrecao: new Date().toISOString()
          });
          await updateDoc(doc(db, "usuarios", uid), { conteudosConcluidos: arrayUnion(conteudoId) });

          const conteudo = conteudosPorId[conteudoId] || {};
          await criarNotificacao(db, {
            userId: uid, tipo: "correcao",
            mensagem: `Sua atividade "${conteudo.titulo || "atividade"}" foi corrigida.`,
            link: "correcoes.html"
          });

          if (conteudo.moduloId) {
            const [moduloSnap, conteudosDoModuloSnap, alunoSnap] = await Promise.all([
              getDoc(doc(db, "modulos", conteudo.moduloId)),
              getDocs(query(collection(db, "conteudos"), where("moduloId", "==", conteudo.moduloId))),
              getDoc(doc(db, "usuarios", uid))
            ]);
            const moduloDados = moduloSnap.exists() ? moduloSnap.data() : null;
            const conteudosDoModulo = conteudosDoModuloSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            const alunoDados = alunoSnap.exists() ? { uid, ...alunoSnap.data() } : { uid, conteudosLiberados: [] };

            await liberarProximoSeSequencial(db, {
              modulo: moduloDados, moduloId: conteudo.moduloId, conteudosDoModulo,
              conteudoAtualId: conteudoId, aluno: alunoDados
            });
          }

          await carregarTudo();
        });
      });
    }
  </script>
</body>
</html>
